
name: Android APK

on:
  push:
    branches: [main, master, ana]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Site dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp index.html style.css www/
          cp ./*.js www/

      - name: Capacitor kurulumu
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: bilgi-arenasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
