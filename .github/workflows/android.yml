name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Web dosyalarını hazırla
        run: |
          WEB=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          if [ "$WEB" != "." ]; then
            mkdir -p "$WEB"
            cp index.html style.css manifest.json sw.js *.js icon-*.png "$WEB"/ 2>/dev/null || true
            cp -r assets "$WEB"/ 2>/dev/null || true
          fi

      - name: Paket adını ayır (eski uygulamayla çakışmasın)
        run: |
          node -e "
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          if(!c.appId.endsWith('.v2')) c.appId=c.appId+'.v2';
          fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));
          console.log('appId:',c.appId);"

      - name: Android projesini hazırla
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: AdMob eklentisini kur
        run: npm install @capacitor-community/admob@^6 --no-audit --no-fund

      - name: AdMob uygulama kimliğini ekle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          npx cap sync android
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle || true
          node -e "
          const fs=require('fs');
          const f='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(f,'utf8');
          if(!x.includes('com.google.android.gms.ads.APPLICATION_ID')){
            x=x.replace('</application>','    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"'+process.env.ADMOB_APP_ID+'\"/>\n    </application>');
            fs.writeFileSync(f,x);
          }
          console.log('AdMob app id:',process.env.ADMOB_APP_ID);"

      - name: AdMob eklentisi Android projesinde mi kontrol et
        run: |
          npm ls @capacitor/core @capacitor-community/admob || true
          grep -i admob android/capacitor.settings.gradle || { echo "HATA: AdMob eklentisi Android projesine eklenmedi"; exit 1; }

      - name: Paket adını Gradle'a uygula
        run: |
          ID=$(node -p "require('./capacitor.config.json').appId")
          sed -i -E "s/applicationId \"[^\"]*\"/applicationId \"$ID\"/" android/app/build.gradle
          grep -n applicationId android/app/build.gradle

      - name: Uygulama ikonunu ayarla (büyük logo, uyarlanabilir ikon)
        run: |
          RES=android/app
