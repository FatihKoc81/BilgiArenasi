name: Android APK

on:
  push:
    branches: [main, master, ana]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Site dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp index.html style.css www/
          cp ./*.js www/
          cp manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Capacitor kurulumu
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: İkonları oluştur
        run: npx capacitor-assets generate --android

      - name: Sabit imza anahtarını yükle (çakışma hatasını önler)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          elif [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > ~/.android/debug.keystore
          else
            echo "::error::Sabit imza anahtarı yok. Depoya debug.keystore.b64 dosyasını ekle."
            exit 1
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2

      - name: versionCode'u her derlemede artır
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: bilgi-arenasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı herkese açık indirme bağlantısı olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BilgiArenasi.apk
          gh release delete son --yes --cleanup-tag || true
          gh release create son BilgiArenasi.apk --target "${{ github.sha }}" --title "Son sürüm" --notes "Otomatik derlenen son APK" --latest
