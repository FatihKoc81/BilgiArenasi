<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Arenası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menuEkran" class="ekran">
        <h1>🧠 BİLGİ ARENASI</h1>
        
        <div class="kutu">
            <div class="baslik">Efsanevi Bilgi Sınavı</div>
            <div class="altbaslik">Bilgini test et ve stratejini konuştur, zirvedeki büyük ödüle adım adım yaklaş!</div>
            
            <button id="milyoner" class="buton milyoner" onclick="milyonerOyunuBaslat()">🎯 Milyoner</button>
            <button id="passaparola" class="buton passaparola">abc Passaparola</button>
            <button id="kelime" class="buton kelime">💎 Kelime Oyunu</button>
            <button id="islem" class="buton islem" onclick="islemOyununuBaslat()">🔢 İşlem Oyunu</button>
        </div>
        
        <div class="fk-logo">FK</div>
    </div>

    <!-- Milyoner Ekranı -->
    <div id="milyoner-ekrani" class="ekran" style="display: none;">
        <div class="ust-bilgi">
            <span id="seviye-bilgi">Seviye 1</span>
            <span id="soru-bilgi">Soru 1/15</span>
        </div>
        <div id="soru-metni" class="soru-kutu">Soru yükleniyor...</div>
        
        <div class="secenekler">
            <button class="secenek-btn">A) ---</button>
            <button class="secenek-btn">B) ---</button>
            <button class="secenek-btn">C) ---</button>
            <button class="secenek-btn">D) ---</button>
        </div>
        
        <button class="buton" onclick="anaMenuyeDon()">Ana menü</button>
    </div>

    <!-- İşlem Oyunu Ekranı -->
    <div id="islem-ekrani" class="ekran" style="display: none;">
        <h2>TRT 1 Bir İşlem</h2>
        <div class="hedef-alani">
            <span>HEDEF SAYI:</span>
            <h1 id="hedef-sayi">---</h1>
        </div>
        
        <div class="verilen-sayilar-alani">
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu buyuk-sayi">-</span>
        </div>

        <button class="buton" onclick="islemOyununuBaslat()">Yeni Sayılar</button>
        <button class="buton" onclick="anaMenuyeDon()">Ana menü</button>
    </div>

    <!-- JavaScript Dosyaları (Doğru Sıralama) -->
    <script src="ortak.js"></script>
    <script src="dm.js"></script>
    <script src="passaparola.js"></script>
    <script src="kelime.js"></script>
    <script src="islem.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const jPas = document.getElementById("jPas");
            if (jPas) {
                jPas.onclick = () => {
                    if (typeof kilit !== 'undefined' && (kilit || !jok.pas)) return;
                    jok.pas = 0; 
                    jPas.disabled = true;
                    if (typeof sonraki === 'function') sonraki();
                };
            }

            const baslaBtn = document.getElementById("basla");
            if (baslaBtn) baslaBtn.onclick = typeof baslat === 'function' ? baslat : null;

            const sifirlaBtn = document.getElementById("sifirla");
            if (sifirlaBtn) {
                sifirlaBtn.onclick = () => {
                    if (confirm("Tüm ilerleme silinsin mi?")) {
                        if (typeof st !== 'undefined') st = { seviye: 1 };
                        if (typeof kaydet === 'function') kaydet();
                        if (typeof menu === 'function') menu();
                    }
                };
            }

            const sDevam = document.getElementById("sDevam");
            if (sDevam) sDevam.onclick = typeof baslat === 'function' ? baslat : null;

            const sMenu = document.getElementById("sMenu");
            if (sMenu) sMenu.onclick = typeof menu === 'function' ? menu : null;
        });
    </script>
</body>
</html>
