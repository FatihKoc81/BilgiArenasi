<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Arenası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <!-- Üst Başlık -->
        <header class="header">
            <h1>🧠 BİLGİ ARENASI</h1>
        </header>

        <!-- Ortalanan Ana Bölüm -->
        <main class="content-area">
            <div class="card" id="start-screen">
                <div class="badge">Seviye 1</div>
                <h2>Efsanevi Bilgi Sınavı</h2>
                <p>Bilgini test et ve stratejini konuştur,<br>zirvedeki büyük ödüle adım adım yaklaş!</p>
                
                <button id="btn-start" class="btn btn-primary" onclick="oyunuBaslat()">🎯 Oyuna Başla</button>
                <button id="btn-reset" class="btn btn-secondary" onclick="ilerlemeyiSifirla()">🔄 İlerlemeyi Sıfırla</button>
            </div>
        </main>

        <!-- Alt Bilgi -->
        <footer class="footer">
            BİLGİ ARENASI
        </footer>
    </div>

    <script src="sorular.js"></script>
    <script>
        function oyunuBaslat() {
            if (typeof baslat === 'function') baslat();
            else if (typeof startQuiz === 'function') startQuiz();
            else if (typeof initGame === 'function') initGame();
        }
        function ilerlemeyiSifirla() {
            if (typeof sifirla === 'function') sifirla();
            else { localStorage.clear(); location.reload(); }
        }
    </script>
</body>
</html>
