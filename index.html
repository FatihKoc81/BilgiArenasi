<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Arenası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Roboto, Arial, sans-serif;
        }
        body {
            background-color: #02040f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
        }
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .header h1 {
            font-size: 2rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card {
            background-color: #000514;
            border: 1px solid #1e293b;
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(30, 41, 59, 0.35);
            margin: auto 0;
        }
        .stage-badge {
            background-color: #4a0000;
            color: #fde8c8;
            padding: 8px 26px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 22px;
        }
        .title {
            font-size: 1.7rem;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .description {
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-start {
            background: #3a0000;
            color: #ffffff;
        }
        .btn-reset {
            background-color: #1e293b;
            color: #94a3b8;
        }
        .footer {
            color: #475569;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 BİLGİ ARENASI</h1>
    </div>

    <div class="card">
        <div class="stage-badge">Seviye 1</div>
        <div class="title">Efsanevi Bilgi Sınavı</div>
        <div class="description">
            Bilgini test et ve stratejini konuştur,<br>zirvedeki büyük ödüle adım adım yaklaş!
        </div>

        <button id="start-btn" class="btn btn-start">🎯 Oyuna Başla</button>
        <button id="reset-btn" class="btn btn-reset">🔄 İlerlemeyi Sıfırla</button>
    </div>

    <div class="footer">
        BİLGİ ARENASI
    </div>

    <script src="sorular.js"></script>
</body>
</html>
