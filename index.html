<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Arenası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #f39c12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card {
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            margin: auto 0;
        }

        .stage-badge {
            background-color: #7f2d0f;
            color: #ffedd5;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .description {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #ffffff;
        }

        .btn-reset {
            background-color: #1e293b;
            color: #94a3b8;
        }

        .footer {
            color: #475569;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 BİLGİ ARENASI</h1>
    </div>

    <div class="card">
        <div class="stage-badge">Aşama 1</div>
        <div class="title">1.000.000 Puanlık Yarışma</div>
        <div class="description">
            15 soruyu bil, jokerrlerini stratejik kullan ve büyük ödüle ulaş!
        </div>
        
        <button id="start-btn" class="btn btn-start">🎯 Oyuna Başla</button>
        <button id="reset-btn" class="btn btn-reset">🔄 İlerlemeyi Sıfırla</button>
    </div>

    <div class="footer">
        BİLGİ ARENASI
    </div>

    <script src="sorular.js"></script>
</body>
</html>
