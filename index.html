<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Arenası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ana-menu" class="ekran">
        <h1>🧠 BİLGİ ARENASI</h1>
        <div class="menu-kutusu">
            <p>Efsanevi Bilgi Sınavı</p>
            <!-- Milyoner Butonu -->
            <button id="milyoner-btn" class="menu-btn" onclick="milyonerOyunuBaslat()">🎯 Milyoner</button>
            <button id="passaparola-btn" class="menu-btn">abc Passaparola</button>
            <button id="kelime-btn" class="menu-btn">💎 Kelime Oyunu</button>
            <button id="islem-btn" class="menu-btn" onclick="islemOyununuBaslat()">🔢 İşlem Oyunu</button>
        </div>
    </div>

    <!-- Milyoner Ekranı -->
    <div id="milyoner-ekrani" class="ekran" style="display: none;">
        <h2 id="seviye-bilgi">Seviye 1</h2>
        <h3 id="soru-bilgi">Soru 1/15</h3>
        <div id="soru-metni">Soru yükleniyor...</div>
        
        <div class="secenekler-alani">
            <button class="secenek-btn">A) ---</button>
            <button class="secenek-btn">B) ---</button>
            <button class="secenek-btn">C) ---</button>
            <button class="secenek-btn">D) ---</button>
        </div>
        
        <button onclick="anaMenuyeDon()">Ana Menü</button>
    </div>

    <!-- İşlem Oyunu Ekranı -->
    <div id="islem-ekrani" class="ekran" style="display: none;">
        <h2>TRT 1 Bir İşlem Oyun Alanı</h2>
        <div class="hedef-alani">
            <span>HEDEF SAYI:</span>
            <h1 id="hedef-sayi">---</h1>
        </div>
        
        <div class="verilen-sayilar-alani">
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu">-</span>
            <span class="sayi-kutusu buyuk-sayi">-</span>
        </div>

        <button onclick="islemOyununuBaslat()">Yeni Sayılar Çek</button>
        <button onclick="anaMenuyeDon()">Ana Menü</button>
    </div>

    <!-- JavaScript Dosyaları Doğru Sırayla Yükleniyor -->
    <script src="ortak.js"></script>
    <script src="dm.js"></script>
    <script src="passaparola.js"></script>
    <script src="kelime.js"></script>
    <script src="islem.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Güvenli başlatma fonksiyonları
            const jPas = document.getElementById("jPas") || document.querySelector("#jPas");
            if (jPas) {
                jPas.onclick = () => {
                    if (typeof kilit !== 'undefined' && (kilit || !jok.pas)) return;
                    jok.pas = 0; 
                    jPas.disabled = true;
                    if (typeof sonraki === 'function') sonraki();
                };
            }

            const baslaBtn = document.getElementById("basla") || document.querySelector("#basla");
            if (baslaBtn) baslaBtn.onclick = typeof baslat === 'function' ? baslat : null;

            const sifirlaBtn = document.getElementById("sifirla") || document.querySelector("#sifirla");
            if (sifirlaBtn) {
                sifirlaBtn.onclick = () => {
                    if (confirm("Tüm ilerleme silinsin mi?")) {
                        if (typeof st !== 'undefined') st = { seviye: 1 };
                        if (typeof kaydet === 'function') kaydet();
                        if (typeof menu === 'function') menu();
                    }
                };
            }
        });
    </script>
</body>
</html>
