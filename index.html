<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Bilgi Arenası</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<h1>🧠 BİLGİ ARENASI</h1>

<main class="kart" id="ana">
<div class="pill" id="seviye">Seviye 1</div>
<p class="alt"><span>Bilgini test et ve stratejini konuştur,</span><span>zirvedeki büyük ödüle adım adım yaklaş!</span></p>
<button class="btn" id="basla">🎯 Oyuna Başla</button>
<button class="btn ikinci" id="sifirla">🔄 İlerlemeyi Sıfırla</button>
</main>

<section class="kart hidden" id="oyun">
<div class="ust"><b id="oSeviye"></b><span id="sayac"></span></div>
<div class="cubuk"><div id="bar"></div></div>
<p id="soruMetni"></p>
<div id="secenekler"></div>
<div class="jokerler">
<button class="jok" id="jYarim">✂️ 50:50</button>
<button class="jok" id="jSeyirci">👥 Seyirci</button>
<button class="jok" id="jCift">🛡️ Çift Cevap</button>
</div>
</section>

<section class="kart hidden" id="son">
<h2 id="sBaslik"></h2>
<p class="alt" id="sMetin"></p>
<button class="btn" id="sDevam"></button>
<button class="btn ikinci" id="sMenu">Ana menü</button>
</section>

<script src="sorular.js"></script>
<script>
// milyonerSorulari {seviye1:[{soru,secenekler,cevap}]} -> SORULAR [[soru,[secenekler],dogruIndex]]
var SORULAR = (function () {
  if (typeof milyonerSorulari === "undefined") return typeof window.SORULAR !== "undefined" ? window.SORULAR : [];
  return Object.keys(milyonerSorulari)
    .sort((a, b) => parseInt(a.replace(/\D/g, "")) - parseInt(b.replace(/\D/g, "")))
    .map(k => milyonerSorulari[k].map(q => {
      const sec = q.secenekler || q.seceler || q.secenek || q.siklar || [];
      let d = sec.findIndex(s => String(s).trim() === String(q.cevap).trim());
      if (d < 0) d = 0;
      return [q.soru, sec, d];
    }));
})();
</script>
<script>
const KEY = "bilgiArenasi";
const $ = id => document.getElementById(id);
let st = { seviye: 1 };
try { st = JSON.parse(localStorage.getItem(KEY)) || st; } catch (e) {}
const kaydet = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

let lv, soru, kilit, jok, butonlar, ciftAktif;

function ekran(id) {
  ["ana", "oyun", "son"].forEach(e => $(e).classList.toggle("hidden", e !== id));
}

function menu() {
  $("seviye").textContent = st.seviye > SORULAR.length ? "Tamamlandı 🏆" : "Seviye " + st.seviye;
  ekran("ana");
}

function baslat() {
  if (st.seviye > SORULAR.length) { st.seviye = 1; kaydet(); }
  lv = SORULAR[st.seviye - 1];
  soru = 0;
  jok = { yarim: 1, seyirci: 1, cift: 1 };
  ciftAktif = false;
  $("oSeviye").textContent = "Seviye " + st.seviye;
  ["jYarim", "jSeyirci", "jCift"].forEach(j => $(j).disabled = false);
  ekran("oyun");
  goster();
}

// Soruyu ortadan bölür: üst satır alttan uzun olmaz
function bol(metin) {
  const orta = Math.floor(metin.length / 2);
  const i = metin.lastIndexOf(" ", orta);
  if (i === -1) return metin;
  return metin.slice(0, i) + "<br>" + metin.slice(i + 1);
}

function goster() {
  const q = lv[soru];
  kilit = false;
  ciftAktif = false; // çift cevap sadece joker basılan soru için geçerli
  $("sayac").textContent = "Soru " + (soru + 1) + "/" + lv.length;
  $("bar").style.width = (soru / lv.length * 100) + "%";
  $("soruMetni").innerHTML = bol(q[0]);
  const kutu = $("secenekler");
  kutu.innerHTML = "";
  butonlar = q[1].map((t, i) => {
    const b = document.createElement("button");
    b.className = "sec";
    b.append("ABCD"[i] + ") " + t);
    b.onclick = () => cevapla(i);
    kutu.append(b);
    return b;
  });
}

function sonraki() {
  soru++;
  soru >= lv.length ? bitir(true) : goster();
}

function cevapla(i) {
  if (kilit) return;
  const dogru = lv[soru][2];

  // Çift cevap aktifken ilk yanlış cevap: yanlış şıkkı kaldır, ikinci hak ver
  if (i !== dogru && ciftAktif) {
    ciftAktif = false;
    butonlar[i].disabled = true;
    butonlar[i].classList.add("yanlis");
    setTimeout(() => butonlar[i].classList.add("gizli"), 500);
    return;
  }

  kilit = true;
  butonlar[dogru].classList.add("dogru");
  if (i === dogru) return void setTimeout(sonraki, 900);
  butonlar[i].classList.add("yanlis");
  setTimeout(() => bitir(false), 1300);
}

function bitir(kazandi) {
  $("bar").style.width = "100%";
  if (kazandi) {
    st.seviye++;
    kaydet();
    const hepsi = st.seviye > SORULAR.length;
    $("sBaslik").textContent = hepsi ? "🏆 Büyük ödül senin!" : "🎉 Seviye geçildi!";
    $("sMetin").textContent = hepsi ? "Tüm seviyeleri tamamladın." : "Sıradaki: Seviye " + st.seviye;
    $("sDevam").textContent = hepsi ? "Baştan oyna" : "Sonraki seviye";
  } else {
    // Kaybedince bir alt seviyeden devam (Seviye 1'de aynı seviye tekrarlanır)
    const eski = st.seviye;
    if (st.seviye > 1) st.seviye--;
    kaydet();
    $("sBaslik").textContent = "❌ Yanlış cevap";
    if (eski > 1) {
      $("sMetin").textContent = "Seviye " + eski + " tamamlanamadı. Bir alt seviyeye düştün: Seviye " + st.seviye + ".";
      $("sDevam").textContent = "Seviye " + st.seviye + "'den devam et";
    } else {
      $("sMetin").textContent = "Seviye 1 tamamlanamadı. Tekrar dene!";
      $("sDevam").textContent = "Tekrar dene";
    }
  }
  ekran("son");
}

function guvenliBaslat() {
  try {
    if (typeof SORULAR === "undefined") {
      alert("HATA: sorular.js yüklenmedi ya da SORULAR bulunamadı.");
      return;
    }
    baslat();
  } catch (e) {
    alert("Milyoner hatası: " + e.message);
  }
}
document.addEventListener("click", e => {
  if (e.target.closest("#basla") || e.target.closest("#sDevam")) guvenliBaslat();
});

$("jYarim").onclick = () => {
  if (kilit || !jok.yarim) return;
  jok.yarim = 0;
  $("jYarim").disabled = true;
  const dogru = lv[soru][2];
  const yanlislar = [0, 1, 2, 3].filter(i => i !== dogru).sort(() => Math.random() - .5);
  yanlislar.slice(0, 2).forEach(i => butonlar[i].classList.add("gizli"));
};

$("jSeyirci").onclick = () => {
  if (kilit || !jok.seyirci) return;
  jok.seyirci = 0;
  $("jSeyirci").disabled = true;
  const dogru = lv[soru][2];
  const acik = [0, 1, 2, 3].filter(i => !butonlar[i].classList.contains("gizli"));
  let kalan = 100;
  const d = 45 + Math.floor(Math.random() * 30);
  const yuzde = {};
  yuzde[dogru] = d;
  kalan -= d;
  const digerleri = acik.filter(i => i !== dogru);
  digerleri.forEach((i, n) => {
    const p = n === digerleri.length - 1 ? kalan : Math.floor(Math.random() * kalan);
    yuzde[i] = p;
    kalan -= p;
  });
  acik.forEach(i => {
    const s = document.createElement("span");
    s.textContent = " %" + yuzde[i];
    butonlar[i].append(s);
  });
};

// ÇİFT CEVAP: bu soruda iki cevap hakkı verir
$("jCift").onclick = () => {
  if (kilit || !jok.cift) return;
  jok.cift = 0;
  ciftAktif = true;
  $("jCift").disabled = true;
};

$("sMenu").onclick = menu;
menu();
</script>

<script src="ortak.js"></script>
<script src="passaparola.js"></script>
<script src="kelime.js"></script>
<script src="kelimelerim.js"></script>
<script src="islem.js"></script>
<script src="cember.js"></script>
<script>
// Ana sayfanın sol altına APK indirme butonu (uygulamanın içinde görünmez)
(function () {
  var APK_ADRES = "https://github.com/FatihKoc81/bilgi-arenasi/releases/latest/download/bilgi-arenasi.apk"; // her derlemede otomatik güncellenir
  if (window.Capacitor || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) return;
  var st = document.createElement("style");
  st.textContent = ".apk-btn{position:fixed;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:5px;padding:7px 11px;border:2px solid #c9a032;border-radius:12px;background:rgba(0,0,0,.35);color:#d4a63a;font:italic 800 15px Georgia,'Times New Roman',serif;text-decoration:none;letter-spacing:.5px}.apk-btn:active{opacity:.7}.apk-btn.gizli{display:none}";
  document.head.appendChild(st);
  var a = document.createElement("a");
  a.className = "apk-btn gizli";
  a.href = APK_ADRES;
  a.setAttribute("download", "");
  a.textContent = "⬇ APK";
  document.body.appendChild(a);
  function guncelle() {
    var ana = document.getElementById("ana");
    var gor = ana && !ana.classList.contains("hidden") && getComputedStyle(ana).display !== "none";
    a.classList.toggle("gizli", !gor);
  }
  guncelle();
  setInterval(guncelle, 500);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  const eskiKontrol = navigator.serviceWorker.controller;
  let yenilendi = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!eskiKontrol || yenilendi) return;
    yenilendi = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(reg => {
        reg.update();
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
</body>
</html>
